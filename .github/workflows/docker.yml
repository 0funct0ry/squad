name: Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build/push (e.g. v1.2.3) — must already exist"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          echo "${{ github.event.inputs.version }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Invalid version format: ${{ github.event.inputs.version }}"
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0

      - name: Check tag exists
        run: git rev-parse "${{ github.event.inputs.version }}" >/dev/null

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.event.inputs.version }}
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/0funct0ry/squad:${{ github.event.inputs.version }}
            ghcr.io/0funct0ry/squad:latest
