name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck install script
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
